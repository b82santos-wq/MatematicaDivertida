    <script>
      // Guarda a referência original do fetch antes de o alterarmos
      const originalFetch = window.fetch;

      // 1. Intercetor de pedidos à API para simular o servidor e a carteira
      window.fetch = async function(...args) {
        const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url) || "";
        
        // Se o jogo procurar o estado da loja ou os dados da carteira do utilizador
        if (url.includes('/api/billing/status') || url.includes('/api/')) {
          return new Response(JSON.stringify({ 
            ready: true, 
            status: "active",
            id: "local_user_wallet",
            paidBalance: 0,
            unlocks: ["explorador", "cientista", "facil"],
            revision: 1
          }), {
            status: 200,
            headers: { 'Content-Type': 'application/json' }
          });
        }
        return originalFetch.apply(this, args);
      };

      // 2. Interceta o sucesso do pagamento e injeta os diamantes no telemóvel
      const originalShow = PaymentRequest.prototype.show;
      PaymentRequest.prototype.show = async function() {
        const res = await originalShow.apply(this);
        try {
          const sku = this.methodData[0]?.data?.sku || "";
          if (sku === "diamantes_1300" || sku === "diamantes_500") {
            const amount = sku === "diamantes_1300" ? 1300 : 500;
            const raw = localStorage.getItem('game_state_snapshot');
            if (raw) {
              const state = JSON.parse(raw);
              state.earned = (state.earned || 0) + amount;
              localStorage.setItem('game_state_snapshot', JSON.stringify(state));
            }
          }
        } catch (e) {
          console.error("Erro ao creditar diamantes locais:", e);
        }
        return res;
      };
    </script>
